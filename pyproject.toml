[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "klopotannia-bot"
version = "0.1.0"
description = "Telegram-бот для генерації та перевірки клопотань (.docx)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
	"aiogram>=3.32.0",
	"python-docx>=1.2.0",
	"python-dotenv>=1.2.4",
]

[project.scripts]
bot = "app.bot:run"
test-docx = "tests.test_docx:main"

[dependency-groups]
dev = [
	"pytest>=9.2.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
indent-width = 2
extend-exclude = ["skills"]

[tool.ruff.lint]
ignore = ["W191"]

[tool.ruff.format]
indent-style = "tab"
